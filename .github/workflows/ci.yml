name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Hermetic suites (scanner, web app, server)
        run: python tests/run_all.py
      - name: Evaluation numbers
        run: python tests/evaluate.py
      - name: hexbench - no regression against bench/results/hexbane.json
        run: python bench/run.py --check bench/results/hexbane.json
      - name: hexbench - keyword baseline through the command adapter
        run: python bench/run.py --name "keyword baseline" --command "python bench/baselines/keyword_grep.py {path}"

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Browser scanner equals Python scanner
        run: python ui-tests/parity.py
        env:
          HEXBANE_BROWSER: chromium
      - name: Scan page renders without JavaScript errors
        run: python ui-tests/shots.py /tmp/shots
        env:
          HEXBANE_BROWSER: chromium

  self-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          path: .
          fail-on: high
