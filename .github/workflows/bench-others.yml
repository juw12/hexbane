name: hexbench other scanners

# Runs third-party scanners through bench/run.py on GitHub's runners (not on a desktop with
# endpoint protection). Only offline modes that need no API key are used.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cisco-mcp-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Install cisco-ai-mcp-scanner
        run: |
          uv tool install --python 3.13 cisco-ai-mcp-scanner
          uv tool list | grep -i cisco
      - name: Score with hexbench
        run: |
          mkdir -p out
          python bench/run.py \
            --name "cisco mcp-scanner (yara analyzer, static tools mode)" \
            --command "python bench/adapters/cisco_yara.py {path}" \
            --timeout 300 \
            --json out/cisco-mcp-scanner.json | tee out/cisco-mcp-scanner.md
      - uses: actions/upload-artifact@v4
        with:
          name: hexbench-others
          path: out/

  mcp-shield-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe mcp-shield on two cases (no API key)
        run: |
          python3 bench/run.py --export /tmp/cases
          npx -y mcp-shield --help || true
          for c in heldout/h07-zed-config tuning/m09-unpinned-mcp heldout/h02-redirect-payments; do
            echo "== $c"; ls /tmp/cases/$c
            for f in /tmp/cases/$c/*.json; do
              echo "-- $f"
              timeout 120 npx -y mcp-shield --path "$f"; echo "exit=$?"
            done
          done
